name: Hitta Troman-kommuner (provar alla subdomäner)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hitta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Prova alla kandidater och uppdatera kallor.csv
        run: python -m plenum.hitta_troman --uppdatera
      - uses: actions/upload-artifact@v4
        with:
          name: troman-funna
          path: data/troman_funna.csv
      - name: Spara uppdaterad kallor.csv i repot
        run: |
          git config user.name "plenum-bot"
          git config user.email "bot@plenum.se"
          git add config/kallor.csv
          git diff --cached --quiet || git commit -m "Troman-kommuner hittade automatiskt"
          git push
