name: Kartlägg kommuner utan källa

on:
  workflow_dispatch:
    inputs:
      org:
        description: "En org_slug (tomt = alla utan källa)"
        required: false

jobs:
  kartlagg:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Kartlägg
        run: |
          if [ -n "${{ github.event.inputs.org }}" ]; then
            python -m plenum.kartlagg --org "${{ github.event.inputs.org }}"
          else
            python -m plenum.kartlagg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kartlaggning
          path: data/kartlaggning.csv
