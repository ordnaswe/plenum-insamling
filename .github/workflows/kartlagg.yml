name: Kartlägg kommuner utan källa

on:
  workflow_dispatch:
    inputs:
      org:
        description: "En org_slug (tomt = alla utan källa)"
        required: false

permissions:
  contents: write

jobs:
  kartlagg:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Kartlägg (och skriv in bekräftade Netpublicator-register i kallor.csv)
        run: |
          if [ -n "${{ github.event.inputs.org }}" ]; then
            python -m plenum.kartlagg --uppdatera --org "${{ github.event.inputs.org }}"
          else
            python -m plenum.kartlagg --uppdatera
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kartlaggning
          path: data/kartlaggning.csv
      - name: Spara uppdaterad kallor.csv i repot
        run: |
          git config user.name "plenum-bot"
          git config user.email "bot@plenum.se"
          git add config/kallor.csv
          git diff --cached --quiet || git commit -m "Netpublicator-register hittade av kartläggningen"
          git push
